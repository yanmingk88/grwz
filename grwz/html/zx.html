<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>吴险胜的个人网站</title>
    <link rel="icon" type="image/x-icon" href="/t2/wytbtx.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      nav {
        position: -webkit-sticky; /*兼容Safari浏览器的sticky*/
        position: sticky;
        display: flex;
        align-items: center;
        /* 原有样式全部保留，不要删！不要改！ */
        /* 只新增下面4行，布局100%不变 */
        position: -webkit-sticky; /*兼容Safari浏览器的sticky*/
        position: sticky;
        display: flex; /*使用flex布局*/
        align-items: center; /*垂直居中对齐*/
        padding: 20px 15px; /*内边距*/
        background-color: #494747; /*背景颜色*/
        height: 50px; /*导航栏高度*/
      }
      .logo {
        display: flex; /*使用flex布局*/
      }
      .logo-tp {
        margin-right: 15px; /*头像与文字之间的间距*/
        border-radius: 50%;
      }
      .logo-text {
        /* 修复重复类名问题 */
        font-size: 40px;
        font-weight: bold;
        color: #f2f3d7;
      }

      .dh {
        display: flex;
        align-items: center;
        margin-left: auto; /*将导航链接推到右侧*/ /* 替代固定720px，适配不同屏幕 */
      }
      .dh a {
        display: flex;
        flex-direction: column;
        color: #fffdf0;
        text-decoration: none;
        font-size: 20px;
        margin-left: 20px;
      }
      body {
        margin-left: auto; /*将导航链接推到右侧*/ /* 替代固定720px，适配不同屏幕 */
        margin-right: auto; /*将导航链接推到左侧*/ /* 替代固定720px，适配不同屏幕 */
        font-family: Arial, sans-serif;
        background-color: antiquewhite; /*背景颜色*/
      }
      .ejdh {
        position: -webkit-sticky; /*兼容Safari浏览器的sticky*/
        position: sticky;
        z-index: 999;
        display: flex;
        flex-direction: column;
        position: fixed;
      }
      .ejdh-a button {
        width: 100px;
        height: 45px;
        font-size: 150%;
        background-color: #627aa2;
        border: 2px solid #bff2f4;
        border-radius: 10px;
        margin-top: 60px;
        margin-bottom: 60px;
        margin-left: 5px;
        color: rgb(232, 232, 255);
      }
      .fhdb {
        margin: 15px 2px 0; /*外边距*/ /* 调整外边距，增加左右间距 */
        position: fixed;
        width: 98.2%; /* 占据内容区的宽度 */
        display: flex;
        flex-direction: column;
        justify-content: flex-end; /* 将按钮放在底部 */
        align-items: flex-end; /* 将按钮靠左对齐 */
      }
      .fhdb button {
        position: -webkit-sticky; /*兼容Safari浏览器的sticky*/
        position: sticky;
        top: 0;
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50px;
        width: 50px;
        font-size: xx-large;
        background-color: rgb(243, 225, 225);
        margin: 5px 0 0 0; /* 上右下左 */ /* 调整外边距，增加左右间距 */
      }
      .fhdb a {
        text-decoration: none;
      }
      .gy-ah {
        border: hsla(0, 96%, 52%, 0.855) solid 3px;
        height: 650px;
        width: 90%;
        margin: 10px 120px 0; /* 上右下左 */ /* 调整外边距，增加左右间距 */
      }
    </style>
  </head>
  <body>
    <!-- 导航栏 -->
    <nav>
      <div class="logo">
        <img
          class="logo-tp"
          src="/t2/wytbtx.png"
          alt="头像logo"
          height="60px"
          width="60px"
        />
        <!--修复重复类名问题-->
        <div class="logo-text">WXSD GRWZ</div>
      </div>

      <div class="dh">
        <a href="/index.html">首页</a>
        <a href="/grwz/html/gy.html">关于</a>
        <a href="/grwz/html/fwyan.html">服务</a>
        <a href="/grwz/html/zx.html">资讯</a>
      </div>
    </nav>
    <!-- 二级导航 -->
    <div class="ejdh">
      <a class="ejdh-a" href="#ah"
        ><button><b>资料</b></button></a
      >

      <a class="ejdh-a" href="#xm"
        ><button><b>学习</b></button></a
      >
      <a class="ejdh-a" href="#zp"
        ><button><b>作品</b></button></a
      >
      <a class="ejdh-a" href="#lx" id="fwtz"
        ><button><b>项目</b></button></a
      >
      <a class="ejdh-a" href="#ly"
        ><button><b>其他</b></button></a
      >
    </div>
    <!-- 内容 -->
    <main>
      <div class="gy-ah" id="zd">资料</div>
      <div class="fhdb">
        <a id="zd" href="#"><button class="fhdb-an">🔝</button></a>
        <a id="sx" href=""><button class="fhdb-sx">🔄️</button></a>
      </div>
      <div class="gy-ah" id="xx">学习</div>
      <div class="gy-ah" id="zp">作品</div>
      <div class="gy-ah" id="xm">项目</div>
      <div class="gy-ah" id="qt">其他</div>
    </main>
  </body>
</html>
