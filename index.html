
<!--指令游览器这个是html文档没有这个声明html数据会混乱-->
<!doctype html>
<!--告诉游览器主要是中文-中国服务于全局属性不是强制要求但是影响SEO(网页优化)-->
<html lang="zh-CN">
  <!--头部是游览器与搜索引擎理解网页的关键提供元数据、引入外部资源、配置页面基础规则-->
  <head>
    <!-- 基础设置 -->
    <!--文档字符编码防止中文乱码-->
    <meta charset="UTF-8" />
    <!--IE游览器专属元标签控制其渲染模式IE=edge强制IE用自身最高引擎解析网页，避免低版本导致问题；仅对IE有效现代主流游览器无需此标签，但仍有人保留此标签-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--视口设置-移动端网页适配的基础，解决网页在手机上显示过小问题width=device-width视口宽度等于屏幕宽度initial-scale=1.0保证网页加载时保证1:1显示无缩放-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 标题与描述 -->
    <!--网页的标题会显示在浏览器标签页上，有助于SEO优化；用户收藏时显示名称包含核心关键词-->
    <title>吴险胜的个人网站</title>
    <!--网页的描述有助于搜索引擎理解页面内容，通常在搜索结果中显示；贴合网页内容，控制合理长度100字符差不多了-->
    <meta name="description" content="吴险胜的个人网站导航页" />
    <!--关键词有助于搜索引擎抓取页面内容，通常在搜索结果中不显示；贴合网页内容，控制合理长度10个关键词左右-->
    <meta
      name="keywords"
      content="学习,编程，程序，全栈，个人网站，学习分享，生活，感悟"
    />
    <!--网页的作者信息，有助于搜索引擎理解页面内容，通常在搜索结果中不显示；贴合网页内容，控制合理长度10个关键词左右-->
    <meta name="author" content="吴险胜" />

    <!-- 图标 -->
    <!--link是用来引入外部资源的标签，通常放在head中，用于引入网站图标、样式表等；rel="icon"这个是网页图标-->
    <link rel="icon" href="/img/log.png" />

    <!-- 样式 -->
    <!--link是用来引入外部资源的标签，通常放在head中，用于引入网站图标、样式表等；rel="stylesheet"这个是网页样式表（css）-->
    <link rel="stylesheet" href="/dhye.css" />
    <!--link是用来引入外部资源的标签，通常放在head中，用于引入网站图标、样式表等；rel="stylesheet"这个是网页样式表（css）-->
     <link rel="stylesheet" href="/anliu.css" />
    <!--内嵌样式表-在html里面内嵌的样式表适合临时场景或者小型项目，可以在放<body>里面但是不符合规范也可能出现渲染页面样式闪烁，大型项目还是优先用<link>引入外部样式表方便后期管理调整-->
    <style>
      /* 全局样式 */
      body {
        
        font-family: "微软雅黑", sans-serif; /* 字体 */
        transition: all 0.3s;
      } /* 切换样式时的过渡动画，更丝滑 */
    </style>

    <!-- 社交媒体 -->
    <!--控制网页在社交媒体分享时的显示信息-->
    <meta property="og:title" content="吴险胜的个人网站" />
    <!--控制网页在社交媒体分享时的描述信息-->
    <meta property="og:description" content="吴险胜的个人网站导航页" />
    <!--控制网页在社交媒体分享时的缩略图信息-->
    <meta property="og:image" content="logo.png" />
    <!--控制网页在社交媒体分享时的URL信息-->
    <meta property="og:url" content="https://yanmingk88.github.io/grwz/" />
    <!--控制网页在社交媒体分享时的网站名称信-->
    <meta property="og:site_name" content="吴险胜的个人网站" />
    <!--控制网页在社交媒体分享时的类型信息-->
    <meta property="og:type" content="网站" />
    <!--控制网页在社交媒体分享时的音频信息-->
    <meta property="og:audio" content="音频文件" />
    <!--控制网页在社交媒体分享时的视频信息-->
    <meta property="og:video" content="视频文件" />
    <!--控制网页在社交媒体分享时的区域信息-->
    <meta property="og:locale" content="zh_CN" />
  </head>
  <body>
   <!--导航文案页-->
      <h1 class="biaot biaot-1">导航页</h1>
      <p class="biaot biaot-2">欢迎来到我的个人网站！<hr></p>
      <P class="biaot biaot-3">这是一个展示我个人项目和学习资源的地方<hr></P>
      <p class="biaot biaot-5">气氛都到这来了高低整两句毒鸡汤吧，那就来一句吧嘿嘿<hr></p>
      <p class="biaot biaot-7">如果人生需要竞争，我想那一定是比谁先找到自己！<hr></p>
       <p class="biaot biaot-8">爱你，编程！希望你对我这个菜鸟友好一点！<hr></p>
      <h3 class="biaot biaot-6">点击下方按钮进入我的个人网站，探索更多内容！</h3>
     <pre> </pre>
     <!--网站链接-->
        <div style="text-align: center;">
        <a href="下一个仓库">
        <button style="font-size: 18px;">我的网站</button>
        </a><pre></pre>
      </div>
        <!-- 切换 class 的按钮 -->
    <div class="an btn-group">
        <button
      class="btn btn-dark"
      onclick="document.body.classList.add('dark-theme')"
    >
      开启暗黑模式
    </button>
    </div>
    <div class="an btn-group">
    <button
      class="btn btn-default"
      onclick="document.body.classList.remove('dark-theme')"
    >
      恢复默认模式
    </button>
    </div>
    <div class="an btn-group">
    <button
      class="btn btn-compact"
      onclick="document.body.classList.toggle('compact-layout')"
    >
      切换紧凑布局
    </button>
      </div>
         <div style="text-align: center; ">
         <a href="下一个仓库">
        <button style="font-size: 24px;" >我的简历</button>
        </a>
      </div>
  </body>
</html>
